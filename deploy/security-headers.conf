# Included in every location: nginx drops server-level add_header lines as soon as
# a location declares its own, so the headers live in one snippet.

# The CSP is the privacy guarantee: scripts may only come from this origin and the page
# cannot open network connections anywhere else, so document contents cannot leave the browser.
#   worker-src blob:   the pdf.js worker is bundled inline and started from a blob: URL
#   connect-src data: blob:  bundled sample files and in-memory downloads
#   style-src 'unsafe-inline'  React style attributes and the no-flash background style
#   script-src 'wasm-unsafe-eval'  lets the OCR engine compile its WebAssembly; it does not allow eval()
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' data: blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
