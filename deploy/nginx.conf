server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing is ever uploaded to this server.
    client_max_body_size 1k;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build output: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # OCR runtime (tesseract.js worker, WebAssembly core, language data), copied at build time.
    # Unhashed file names, so cache for a day and revalidate. The .traineddata.gz files are
    # served as-is (no Content-Encoding); tesseract.js decompresses them itself.
    location /ocr/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        gzip off;
        types {
            application/javascript js;
            application/wasm wasm;
            application/octet-stream gz;
        }
        try_files $uri =404;
    }

    # The entry document must always be revalidated so new releases show up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
