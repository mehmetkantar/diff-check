<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Compare two versions of a Word or PDF document. Runs entirely in the browser." />
    <title>Redline</title>
    <!-- Mark: a text line over the blue double underline that means "inserted" -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181c'/%3E%3Crect x='8' y='9' width='16' height='2.5' rx='1.25' fill='%23fdfdfd'/%3E%3Crect x='8' y='14' width='11' height='2.5' rx='1.25' fill='%23fdfdfd'/%3E%3Crect x='8' y='20' width='16' height='1.5' fill='%2393b4ff'/%3E%3Crect x='8' y='23' width='16' height='1.5' fill='%2393b4ff'/%3E%3C/svg%3E" />
    <!--
      No inline script (the CSP forbids it). The background follows the system theme before
      any JavaScript runs; main.tsx then applies a saved preference from localStorage ('redline-theme').
    -->
    <style>
      html { background: #eceef1; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background: #0d0f12; } }
      html[data-theme='light'] { background: #eceef1; }
      html[data-theme='dark'] { background: #0d0f12; }
      html, body, #root { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
